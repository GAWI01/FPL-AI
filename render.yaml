services:
  - type: web
    name: fpl-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: FPL_AI_CORS_ORIGINS
        sync: false

  - type: web
    name: fpl-ai-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
